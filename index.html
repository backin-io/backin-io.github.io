<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BackIn — Launching soon</title>
<meta name="description" content="Something new is coming. Get early access.">
<meta property="og:title" content="BackIn — launching soon">
<meta property="og:description" content="Something new is coming. Get early access.">
<meta property="og:url" content="https://backin.io">
<meta name="theme-color" content="#f6f3ee">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%23111' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23ff5a1f'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@200..800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3ee; --card:#fbfaf7; --ink:#141414; --muted:#6b6862; --line:#e4dfd6;
  --dark:#141414; --dark-2:#1f1e1c; --accent:#ff5a1f; --ok:#1f9d55; --err:#d92d20;
  --r-lg:20px; --r-md:14px;
  --sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}

/* nav */
nav{display:flex;align-items:center;justify-content:space-between;padding:22px 0}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;text-decoration:none;font-size:15px}
.dot{width:20px;height:20px;border-radius:50%;background:none;border:2px solid var(--ink);display:grid;place-items:center}
.dot::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:8px;font-size:13px;padding:7px 14px;border-radius:999px;background:var(--dark);color:#fff;text-decoration:none;font-weight:500}
.status{display:inline-flex;align-items:center;gap:8px;font:500 12px var(--mono);color:var(--muted)}
.status i{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 rgba(255,90,31,.5);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(255,90,31,0)}100%{box-shadow:0 0 0 0 rgba(255,90,31,0)}}

/* hero */
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:48px;align-items:end;padding:12vh 0 8vh}
h1{font-size:clamp(42px,7vw,84px);line-height:1;letter-spacing:-.045em;font-weight:200}
h1 .l{font-weight:200;color:#6b6862}
h1 b{font-weight:800;letter-spacing:-.055em}
.hero p.lead{color:var(--muted);font-size:17px;max-width:420px}
.hero-r{display:flex;flex-direction:column;gap:22px}

/* form */
form{display:flex;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px}
form input[type=email]{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:15px;padding:0 16px;color:var(--ink)}
form input:focus{outline:none}
form:focus-within{border-color:var(--ink)}
form button{font:inherit;font-weight:500;font-size:14px;border:0;border-radius:999px;background:var(--dark);color:#fff;padding:12px 20px;cursor:pointer;white-space:nowrap;transition:transform .15s,background .15s}
form button:hover{background:#000}
form button:active{transform:scale(.97)}
form button[disabled]{opacity:.6;cursor:wait}
.hp{position:absolute;left:-9999px}
.msg{font-size:13px;min-height:20px;color:var(--muted)}
.msg.ok{color:var(--ok)} .msg.err{color:var(--err)}
.msg.dark{color:#a8a39a}.msg.dark.ok{color:#5fd68a}.msg.dark.err{color:#ff8a80}

/* bento */
.bento{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:28px;overflow:hidden;position:relative}
.card h3{font-size:22px;letter-spacing:-.02em;font-weight:600;line-height:1.15}
.card p{color:var(--muted);font-size:14px;margin-top:8px;max-width:340px}
.tag{font:500 11px var(--mono);color:var(--muted);letter-spacing:.04em}
.stage{grid-column:span 7;background:var(--dark);color:#fff;border-color:#000;min-height:420px;display:flex;flex-direction:column;justify-content:space-between}
.stage .tag{color:#8d887f}
.stage p{color:#a8a39a}
.demo{display:flex;align-items:flex-end;gap:28px;margin-top:24px}
.qr{width:128px;height:128px;background:#fff;border-radius:14px;padding:12px;position:relative;flex:none;overflow:hidden}
.qr svg{width:100%;height:100%;display:block}
.qr::after{content:"";position:absolute;left:0;right:0;height:2px;background:var(--accent);box-shadow:0 0 12px var(--accent);animation:scan 3s ease-in-out infinite}
@keyframes scan{0%,100%{top:8%}50%{top:90%}}
.queue{flex:1;display:flex;flex-direction:column;gap:8px}
.q{display:flex;align-items:center;gap:12px;background:var(--dark-2);border:1px solid #2c2a27;border-radius:12px;padding:10px 12px;font-size:13px;opacity:0;transform:translateY(8px);animation:in .5s forwards}
.q:nth-child(1){animation-delay:.6s}.q:nth-child(2){animation-delay:1.4s}.q:nth-child(3){animation-delay:2.2s}
@keyframes in{to{opacity:1;transform:none}}
.q b{width:30px;height:30px;border-radius:8px;flex:none}
.q:nth-child(1) b{background:linear-gradient(135deg,#e9c9b0,#c98f6a)}
.q:nth-child(2) b{background:linear-gradient(135deg,#bcc6d6,#7d8fb0)}
.q:nth-child(3) b{background:linear-gradient(135deg,#d9d2c3,#a89f8c)}
.q span{flex:1}
.q em{font:500 11px var(--mono);font-style:normal;color:#5fd68a}
.q em.w{color:var(--accent)}
.side{grid-column:span 5;display:grid;gap:16px}
.mini{grid-column:span 4}
.bars{margin-top:22px;display:grid;gap:10px}
.bar{display:grid;grid-template-columns:74px 1fr;align-items:center;gap:10px;font:500 10px var(--mono);color:var(--muted)}
.bar s{display:block;height:7px;border-radius:9px;background:var(--dark);text-decoration:none}
.bar s.o{background:var(--accent)}
.steps{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap}
.steps span{font:500 11px var(--mono);padding:6px 10px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}

/* closing */
.cta{margin:16px 0 0;background:var(--dark);color:#fff;border-radius:var(--r-lg);padding:56px 48px;position:relative;overflow:hidden}
.cta h2{font-size:clamp(30px,4.6vw,52px);letter-spacing:-.04em;line-height:1.02;font-weight:600;max-width:520px}
.cta form{margin-top:28px;max-width:460px;background:#1f1e1c;border-color:#34312d}
.cta form input[type=email]{color:#fff}
.cta form input::placeholder{color:#7d786f}
.cta form:focus-within{border-color:#fff}
.cta form button{background:#fff;color:var(--ink)}
.cta form button:hover{background:#eee}
.orb{position:absolute;right:56px;top:50%;width:150px;height:150px;border-radius:50%;background:var(--accent);transform:translateY(-50%);opacity:.95}
.orb::after{content:"";position:absolute;inset:38%;border-radius:50%;background:var(--dark)}

/* footer */
footer{padding:48px 0 0;overflow:hidden}
.foot{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.foot a{text-decoration:none}.foot a:hover{color:var(--ink)}
.mark{font-size:clamp(90px,24vw,320px);font-weight:700;letter-spacing:-.06em;line-height:.78;margin-top:40px;text-align:center;transform:translateY(.12em);user-select:none}

@media(max-width:860px){
  .hero{grid-template-columns:1fr;gap:28px;padding-top:32px}
  .stage,.side{grid-column:1/-1}
  .mini{grid-column:1/-1}
  .demo{flex-direction:column;align-items:flex-start}
  .queue{width:100%}
  .cta{padding:36px 24px}
  .orb{display:none}
  form{border-radius:22px;flex-direction:column;padding:8px}
  form input[type=email]{padding:12px 14px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .q{opacity:1;transform:none}
}
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <a class="logo" href="#"><span class="dot"></span>BackIn</a>
    <a class="pill" href="#join">Get early access</a>
  </nav>

  <header class="hero">
    <div>
      <p class="status" style="margin-bottom:22px"><i></i>Launching soon</p>
      <h1><span class="l">Something</span> <b>new</b> <span class="l">is</span> <b>coming.</b><br><span class="l">Be the first</span> <b>back&nbsp;in.</b></h1>
    </div>
    <div class="hero-r">
      <p class="lead">Leave your email and you’ll be the first to know when the doors open.</p>
      <div>
        <form class="sub" novalidate>
          <input type="email" name="email" placeholder="you@email.com" autocomplete="email" aria-label="Email address" required>
          <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
          <button type="submit">Get early access</button>
        </form>
        <p class="msg" role="status" aria-live="polite"></p>
      </div>
    </div>
  </header>

  <main>
  </main>

  <footer>
    <div class="foot">
      <span>© 2026 BackIn. </span>
      <a href="mailto:hello@backin.io">hello@backin.io</a>
    </div>
    <div class="mark" aria-hidden="true">BackIn</div>
  </footer>
</div>

<script>
// Signup is handled by the Worker at /api/subscribe (same origin).
const ENDPOINT = "/api/subscribe";

const RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
document.querySelectorAll("form.sub").forEach(form => {
  const msg = form.parentElement.querySelector(".msg");
  const btn = form.querySelector("button");
  const set = (t, c) => { msg.textContent = t; msg.classList.remove("ok","err"); if (c) msg.classList.add(c); };
  form.addEventListener("submit", async e => {
    e.preventDefault();
    const email = form.email.value.trim().toLowerCase();
    if (form.website.value) return;                       // honeypot
    if (!RE.test(email)) return set("Enter a valid email address.", "err");
    btn.disabled = true; set("Adding you…");
    try {
      const r = await fetch(ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, source: location.hash || "direct" })
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || "failed");
      form.reset();
      set(d.duplicate ? "You’re already on the list." : "You’re in. We’ll email you at launch.", "ok");
    } catch {
      set("Something went wrong. Try again in a moment.", "err");
    } finally { btn.disabled = false; }
  });
});
</script>
</body>
</html>
